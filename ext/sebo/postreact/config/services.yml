services:
    sebo.postreact.controller.acp:
        class: sebo\postreact\controller\acp_controller
        arguments:
            - '@language'
            - '@request'
            - '@template'
            - '@user'
            - '%core.table_prefix%'
            - '@dbal.conn'
            - '%core.php_ext%'
            - '@config'
            - '%core.root_path%'
            - '@sebo.postreact.service.icon_manager'
            - '@sebo.postreact.service.reaction_count_cache'

    sebo.postreact.controller.ucp:
        class: sebo\postreact\controller\ucp_controller
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@request'
            - '@template'

    sebo.postreact.controller.react_controller:
        class: sebo\postreact\controller\react_controller
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@request'
            - '%core.table_prefix%'
            - '%core.php_ext%'
            - '@notification_manager'
            - '@sebo.postreact.service.notification_helper'
            - '@config'
            - '@sebo.postreact.service.reaction_count_cache'
            - '@auth'
        public: true

    # --- Services ---------------------------------------------------------

    sebo.postreact.service.icon_manager:
        class: sebo\postreact\service\icon_manager
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'

    sebo.postreact.service.notification_helper:
        class: sebo\postreact\service\notification_helper
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'
            - '@user'
            - '@notification_manager'

    sebo.postreact.service.reaction_count_cache:
        class: sebo\postreact\service\reaction_count_cache
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'
            - '@cache.driver'

    # --- Event listeners ----------------------------------------------------
    # Split by responsibility (was previously a single main_listener.php)

    sebo.postreact.listener.language:
        class: sebo\postreact\event\language_listener
        tags:
            - { name: event.listener }

    sebo.postreact.listener.permissions:
        class: sebo\postreact\event\permissions_listener
        tags:
            - { name: event.listener }

    sebo.postreact.listener.viewtopic:
        class: sebo\postreact\event\viewtopic_listener
        arguments:
            - '@dbal.conn'
            - '@user'
            - '%core.table_prefix%'
            - '@auth'
            - '@config'
            - '@sebo.postreact.service.icon_manager'
            - '@template'
            - '@language'
        tags:
            - { name: event.listener }

    sebo.postreact.listener.viewforum:
        class: sebo\postreact\event\viewforum_listener
        arguments:
            - '@auth'
            - '@sebo.postreact.service.icon_manager'
            - '@sebo.postreact.service.reaction_count_cache'
        tags:
            - { name: event.listener }

    sebo.postreact.listener.search:
        class: sebo\postreact\event\search_listener
        arguments:
            - '@language'
            - '@dbal.conn'
            - '@user'
            - '@request'
            - '@template'
            - '%core.table_prefix%'
            - '@auth'
            - '%core.php_ext%'
            - '%core.root_path%'
            - '@sebo.postreact.service.icon_manager'
            - '@sebo.postreact.service.reaction_count_cache'
            - '@config'
        tags:
            - { name: event.listener }

    sebo.postreact.listener.profile:
        class: sebo\postreact\event\profile_listener
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'
            - '@template'
        tags:
            - { name: event.listener }

    sebo.postreact.listener.sort:
        class: sebo\postreact\event\sort_listener
        arguments:
            - '%core.table_prefix%'
            - '@language'
        tags:
            - { name: event.listener }

    sebo.postreact.notification.type.postreact_notification:
        class: sebo\postreact\notification\type\postreact_notification
        shared: false
        parent: notification.type.base
        calls:
            - [set_controller_helper, ['@controller.helper']]
            - [set_user_loader, ['@user_loader']]
            - [set_table_prefix, ['%core.table_prefix%']]
        tags:
            - { name: notification.type }
